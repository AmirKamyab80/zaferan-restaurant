name: Zaferan APK V3

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Extract V3 project
        run: |
          rm -rf app
          mkdir app
          unzip -q zaferan_restaurant_flutter_v3.zip -d app

      - name: Find project
        id: project
        run: |
          P=$(find app -name pubspec.yaml -print -quit)
          D=$(dirname "$P")
          echo "dir=$D" >> "$GITHUB_OUTPUT"
          echo "Project: $D"

      - name: Create Android
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          rm -rf android
          flutter create . --platforms=android

      - name: Get packages
        working-directory: ${{ steps.project.outputs.dir }}
        run: flutter pub get

      - name: Build APK
        working-directory: ${{ steps.project.outputs.dir }}
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: zaferan-v3-test-apk
          path: ${{ steps.project.outputs.dir }}/build/app/outputs/flutter-apk/app-debug.apk
