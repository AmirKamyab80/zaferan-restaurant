name: Build Zaferan APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'zaferan_restaurant_flutter_v2.zip'
      - '.github/workflows/apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Extract Flutter project
        run: |
          rm -rf app
          mkdir app
          unzip -q zaferan_restaurant_flutter_v2.zip -d app

      - name: Create Android platform
        working-directory: app/zaferan_restaurant_flutter_v2
        run: |
          flutter create . --platforms=android

      - name: Install dependencies
        working-directory: app/zaferan_restaurant_flutter_v2
        run: |
          flutter pub get

      - name: Build APK
        working-directory: app/zaferan_restaurant_flutter_v2
        run: |
          flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: zaferan-debug-apk
          path: app/zaferan_restaurant_flutter_v2/build/app/outputs/flutter-apk/app-debug.apk
