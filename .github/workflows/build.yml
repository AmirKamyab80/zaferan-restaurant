name: Build Zaferan APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Flutter project
        run: |
          mkdir -p app
          unzip -q zaferan_restaurant_flutter_v2.zip -d app

      - name: Find Flutter project
        id: project
        run: |
          PROJECT=$(find app -name pubspec.yaml -print -quit)
          if [ -z "$PROJECT" ]; then
            echo "pubspec.yaml not found"
            exit 1
          fi
          DIR=$(dirname "$PROJECT")
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
          echo "Flutter project: $DIR"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate Android files
        working-directory: ${{ steps.project.outputs.dir }}
        run: flutter create --platforms=android .

      - name: Install dependencies
        working-directory: ${{ steps.project.outputs.dir }}
        run: flutter pub get

      - name: Build APK
        working-directory: ${{ steps.project.outputs.dir }}
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: zaferan-test-apk
          path: ${{ steps.project.outputs.dir }}/build/app/outputs/flutter-apk/app-debug.apk
